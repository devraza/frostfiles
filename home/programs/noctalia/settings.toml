[osd]
background_opacity = 0.99999997764825821
border = false
orientation = "vertical"
position_vertical = "center_left"
scale = 0.90000000596046448

    [osd.kinds]
    media = false
    privacy = false

[plugin_settings."noctalia/bitwarden"]
gen_passphrase_capitalize = true
gen_passphrase_words = 3
vault_timeout = "30"

[plugin_settings."noctalia/screen_recorder"]
replay_enabled = true
video_source = "focused"

[plugins]
enabled = [ "samuelskovbakke/calculator-plus", "noctalia/bitwarden", "noctalia/screen_recorder" ]

[shell]
app_icon_color = "secondary"
avatar_path = "/home/devraza/Documents/Profiles/pfp.png"
clipboard_history_max_entries = 10
corner_radius_scale = 0.70000001043081284
font_family = "Cartograph CF"
polkit_agent = true
popup_shadows = false

    [shell.launcher]
    categories = false
    compact = true
    sort_by_usage = false

    [shell.panel]
    control_center_placement = "floating"
    control_center_position = "bottom_left"

    [shell.screenshot]
    save_to_file = false

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = false
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

    [shell.shadow]
    alpha = 0.0

[system.monitor]
cpu_poll_seconds = 5
memory_poll_seconds = 5
network_poll_seconds = 5

[theme]
builtin = "Rosé Pine"
community_palette = "Rose Pine Alt"
shell_mode = "dark"
source = "community"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    enable_builtin_templates = false
    enable_community_templates = false

[wallpaper]
directory = "/etc/nixos/assets/wallpapers"

    [wallpaper.default]
    path = "/etc/nixos/assets/wallpapers/tower-horizon.jpg"

    [wallpaper.last]
    path = "/etc/nixos/assets/wallpapers/tower-horizon.jpg"

    [wallpaper.monitors.DP-1]
    path = "/etc/nixos/assets/wallpapers/tower-horizon.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/etc/nixos/assets/wallpapers/tower-horizon.jpg"

[widget.audio_visualizer]
bands = 32
color_2 = "tertiary"
mirrored = false

[widget.battery]
icon_color = "primary"

[widget.bluetooth]
icon_color = "tertiary"

[widget.brightness]
icon_color = "secondary"

[widget.clipboard]
icon_color = "secondary"

[widget.clock]
anchor = true
capsule = true
capsule_padding = 12
color = "primary"
font_weight = 700
format = "{:%I:%M %p}"

[widget.control-center]
custom_image = "/etc/nixos/assets/nix.png"

[widget.media]
art_size = 18
capsule = true
capsule_padding = 4
hide_artist = true
hide_when_no_media = true
max_length = 256
show_progress = true
title_scroll = "always"

[widget.network]
icon_color = "tertiary"

[widget.notifications]
icon_color = "primary"

[widget.session]
icon_color = "error"

[widget.volume]
icon_color = "secondary"

[widget.workspaces]
active_pill_size = 2.1500000000000004
pill_scale = 0.95000000000000007
show_labels = false