config_version = 14

[bar.default]
background_opacity = 0.74999998323619366
capsule = true
center = [ "clock", "audio_visualizer" ]
end = [ "notifications", "bluetooth", "network", "volume", "brightness", "battery", "session" ]
font_family = "Cartograph CF"
font_scale = 1.1499999817460775
margin_ends = 0
padding = 8
position = "bottom"
radius = 0
shadow = false
start = [ "control-center", "workspaces", "media" ]

[control_center]
hidden_tabs = [ "calendar" ]
sidebar_section = "none"

    [control_center.calendar]
    show_events_card = false

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "power_profile"

    [[control_center.shortcuts]]
    type = "noctalia/screen_recorder:toggle"

    [[control_center.shortcuts]]
    type = "clipboard"

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[location]
auto_locate = true

[lockscreen]
