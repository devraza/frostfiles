add_newline = true
format = """
[▓](#403d52)\
$hostname\
[▓](#403d52) \
$directory \
$git_branch\
$git_status\
\n$character
"""

[character]
success_symbol = "λ"
error_symbol = "λ"

[hostname]
ssh_only = false
format = "[$hostname](bg:#403d52 fg:purple bold)"
disabled = false

[directory]
style = "fg:#e0def4 bg:#31748f"
format = "[ $path ]($style)"
